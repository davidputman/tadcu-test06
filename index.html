<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TADCU — Episode 6: The Latch</title>
<style>
/* ============================================================
   TADCU — Episode 6 "The Latch" — season one finale.
   Production rules unchanged (see Episodes 1-5).
   ============================================================ */
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --cream:#f7e9d7; --slate:#5b6670; --brick:#b04a3a;
  --sheep:#f2ead8; --charcoal:#3a3733; --ink:#2c2a27;
  --brass:#d4a017;
}

html,body { height:100%; background:#191d1a; font-family:"Trebuchet MS",Verdana,sans-serif; }
#theatre { height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:14px; }
#stage { position:relative; width:min(100%,1600px); aspect-ratio:16/9; background:#20301f; border-radius:14px; overflow:hidden; box-shadow:0 18px 50px rgba(0,0,0,.55); }
.panel { position:absolute; inset:0; opacity:0; visibility:hidden; }
.panel.active { opacity:1; visibility:visible; }
#stage.paused * { animation-play-state:paused !important; }
svg { display:block; width:100%; height:100%; }

/* ---------- bubbles ---------- */
.bubble {
  position:absolute; max-width:34%; background:#fffdf6; color:var(--ink);
  border:3px solid var(--ink); border-radius:16px; padding:10px 14px;
  font-family:"Comic Sans MS","Segoe Print","Bradley Hand",cursive;
  font-size:clamp(10px,1.35vw,21px); line-height:1.25; z-index:6; opacity:0;
  animation:bubbleShow var(--dur,4s) ease var(--d,0s) both;
  box-shadow:3px 4px 0 rgba(0,0,0,.18);
}
.bubble::after { content:""; position:absolute; left:22%; bottom:-14px; border:7px solid transparent; border-top-color:var(--ink); }
.bubble i { opacity:.6; font-size:.85em; }
@keyframes bubbleShow {
  0%   { opacity:0; transform:scale(.5); }
  8%   { opacity:1; transform:scale(1.06); }
  13%  { transform:scale(1); }
  86%  { opacity:1; transform:scale(1); }
  100% { opacity:0; transform:scale(.92); }
}

/* ---------- scenery ---------- */
.curl { animation:curl 5s linear infinite; opacity:0; }
.curl.b{ animation-delay:-1.7s; } .curl.c{ animation-delay:-3.4s; }
@keyframes curl {
  0%{ transform:translate(0,0) scale(.4); opacity:0; }
  18%{ opacity:.8; }
  100%{ transform:translate(20px,-80px) scale(1.4); opacity:0; }
}

.bob   { animation:bob .7s ease-in-out infinite alternate; }
.bob.b { animation-delay:-.25s; } .bob.c{ animation-delay:-.5s; } .bob.d{ animation-delay:-.12s; }
@keyframes bob { from{transform:translateY(0);} to{transform:translateY(-9px);} }

.wag  { animation:wag .5s ease-in-out infinite alternate; transform-origin:10px 34px; }
@keyframes wag { from{transform:rotate(-16deg);} to{transform:rotate(18deg);} }
.earPerk { animation:earPerk .7s ease var(--d,0s) both; transform-origin:96px 20px; }
@keyframes earPerk { 0%,40%{transform:rotate(0);} 60%{transform:rotate(-13deg);} 100%{transform:rotate(0);} }

.walkL { animation:walkL var(--dur,8s) linear var(--d,0s) both; }
@keyframes walkL { from{transform:translateX(0);} to{transform:translateX(var(--dx,-1200px));} }

.latchPop { animation:latchPop .8s cubic-bezier(.3,1.8,.4,1) var(--d,0s) both; transform-origin:50% 10%; }
@keyframes latchPop {
  0%,10% { transform:translateY(0) rotate(0); }
  45%    { transform:translateY(-26px) rotate(-24deg); }
  70%    { transform:translateY(-20px) rotate(-18deg); }
  100%   { transform:translateY(-22px) rotate(-20deg); }
}
.confettiFly { }
.cFan { animation:cFan 1.1s cubic-bezier(.2,.9,.4,1) var(--d,0s) both; }
@keyframes cFan { from{ transform:translate(0,40px) scale(.5); opacity:0; } to{ transform:translate(0,-90px) scale(1); opacity:1; } }

.tadBob { animation:tadBob .55s ease-in-out infinite alternate; }
@keyframes tadBob { from{transform:translateY(0) rotate(0deg);} to{transform:translateY(-7px) rotate(-2deg);} }
.capTip { animation:capTip 4s ease 1s both; transform-origin:96px 40px; }
@keyframes capTip { 0%,30%{transform:rotate(0);} 45%{transform:rotate(-8deg) translateY(-3px);} 60%,100%{transform:rotate(0);} }

/* ---------- cards ---------- */
.t-main { font-family:"Comic Sans MS","Segoe Print",cursive; font-weight:700; fill:var(--cream); letter-spacing:.06em; }
.rise { animation:rise 1.5s cubic-bezier(.2,1.35,.4,1) var(--d,0s) both; }
@keyframes rise { from{opacity:0; transform:translateY(70px);} to{opacity:1; transform:translateY(0);} }
.pop  { animation:pop 1s cubic-bezier(.2,1.6,.4,1) var(--d,0s) both; }
@keyframes pop { from{opacity:0; transform:scale(.3);} to{opacity:1; transform:scale(1);} }

/* ---------- subtitle & controls ---------- */
#subBar { position:absolute; left:4%; right:4%; bottom:8.5%; z-index:8; text-align:center; pointer-events:none; }
#sub { display:inline-block; max-width:88%; background:rgba(18,22,18,.85); color:#fff; padding:8px 16px; border-radius:10px; font-size:clamp(11px,1.6vw,22px); line-height:1.3; font-family:"Comic Sans MS","Segoe Print",cursive; }
#sub:empty { opacity:0; }
#sub .who { color:#ffd28a; font-weight:700; margin-right:.45em; text-transform:uppercase; font-size:.78em; letter-spacing:.1em; }
#ui { width:min(100%,1600px); margin-top:10px; display:grid; grid-template-columns:auto auto 1fr auto auto; gap:10px; align-items:center; color:#cfd8cf; font-size:13px; }
#ui button { background:#2c342c; color:#e8eee6; border:1px solid #465046; border-radius:8px; width:46px; height:34px; cursor:pointer; font-size:14px; }
#ui button:hover { background:#39503a; }
#bar { height:10px; background:#2c342c; border-radius:6px; overflow:hidden; cursor:pointer; }
#fill { height:100%; width:0%; background:linear-gradient(90deg,#67a568,#b04a3a); }
#lbl { min-width:250px; text-align:right; opacity:.85; white-space:nowrap; }
#hint { color:#9aa79a; font-size:12px; margin-top:6px; }
</style>
</head>

        <!-- Tadcu, mid-demo -->
        <g transform="translate(200,300) scale(1.5)">
          <g class="capTip" style="animation-delay:2s"><g class="tadBob" style="animation:none"><use href="#tadcu"/></g></g>
        </g>
        <!-- the girls, released like wet confetti -->
        <g class="cFan" style="--d:5.6s" transform="translate(0,0)"><g transform="translate(940,480) scale(.9)"><use href="#sheep-shape"/></g></g>
        <g class="cFan" style="--d:5.75s" transform="translate(30,-30)"><g transform="translate(990,520) scale(.86)"><use href="#sheep-shape"/></g></g>
        <g class="cFan" style="--d:5.9s" transform="translate(60,20)"><g transform="translate(1040,560) scale(.9)"><use href="#sheep-dott"/></g></g>
        <g class="cFan" style="--d:6.05s" transform="translate(90,60)"><g transform="translate(1090,600) scale(.86)"><use href="#sheep-shape"/></g></g>
        <g class="cFan" style="--d:6.2s" transform="translate(120,90)"><g transform="translate(1140,640) scale(.9)"><use href="#sheep-shape"/></g></g>
        <g class="cFan" style="--d:6.35s" transform="translate(150,120)"><g transform="translate(1190,665) scale(.86)"><use href="#sheep-shape"/></g></g>
      </svg>
      </section>

    <!-- ============ SCENE 4 : THE BENCH ============ -->
    <section class="panel" id="p-s4">
      <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
        <defs><linearGradient id="dusk6" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ee9b6f"/><stop offset=".7" stop-color="#6d5a72"/><stop offset="1" stop-color="#41505a"/>
        </linearGradient></defs>
        <rect width="1600" height="900" fill="url(#dusk6)"/>
        <path d="M0 520 Q500 380 1000 540 Q1320 630 1600 560 V900 H0 z" fill="#3f5a48"/>
        <path d="M0 660 Q700 560 1600 640 V900 H0 z" fill="#31503e"/>
        <!-- stars -->
        <g fill="#fffdf6" opacity=".7">
          <circle cx="300" cy="120" r="3"/><circle cx="520" cy="90" r="2"/><circle cx="760" cy="140" r="2.5"/>
          <circle cx="1010" cy="100" r="2"/><circle cx="1240" cy="150" r="3"/><circle cx="1430" cy="110" r="2"/>
        </g>
        <!-- the gate, wide open, latched to nothing -->
        <g transform="translate(960,560)">
          <g class="latchPop" style="--d:2s"><use href="#latchswim" transform="scale(.9)"/></g>
          <use href="#gate" transform="rotate(-80 50 44)"/>

        <!-- the bench: the two leads -->
        <g transform="translate(430,640) scale(1.6)"><use href="#bench"/></g>
        <g transform="translate(400,420) scale(1.5)">
          <g class="tadBob" style="animation:none"><use href="#tadcu"/></g>
        </g>
        <g transform="translate(560,700) scale(1.2)">
          <g class="earPerk" style="--d:3s"><use href="#bryn"/><use href="#bryn-head"/></g>
          <use class="wag" href="#bryn-tail"/>
        </g>
        <!-- the kettle, warm -->
        <g transform="translate(180,700) scale(1.15)"><use href="#kettle"/></g>
        <g transform="translate(224,682)">
          <circle class="curl" r="8"/><circle class="curl b" r="6"/>
        </g>
        <!-- mugs on bench -->
        <rect x="500" y="636" width="22" height="20" rx="3" fill="#e8e8e8"/>
        <rect x="536" y="636" width="22" height="20" rx="3" fill="#e8e8e8"/>

    <!-- ================= END CARD ================= -->
    <section class="panel" id="p-end">
      <svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
        <rect width="1600" height="900" fill="#23281f"/>
        <g transform="translate(500,600) scale(1.3)"><g class="bob"><use href="#sheep-shape"/></g></g>
        <g transform="translate(680,630) scale(1.2)"><g class="bob b"><use href="#sheep-dott"/></g></g>
        <g transform="translate(980,600) scale(1.3)"><g class="bob c"><use href="#sheep-shape"/></g></g>

    </div>

  <div id="ui">
    <button id="bPlay" title="Play / pause">▶</button>
    <button id="bRestart" title="Restart">⟲</button>
    <div id="bar"><div id="fill"></div></div>
    <button id="bSkip" title="Next scene">⏭</button>
    <span id="lbl">Ready — press play</span>
  </div>
  <div id="hint">Keyboard: space = play/pause · → = next scene · 1–6 = jump to a scene · click the bar to scrub by scene.</div>
</div>

<script>
/* ================= TIMELINE ================= */
const SCENES = [
  { id:"p-title", name:"Title", dur:5.5,
    subs:[ {t:.8, who:"Tadcu", x:"Twelve pounds, one crate from Aberystwyth, and a dream you can hear clicking."} ] },
  { id:"p-s1", name:"The Delivery", dur:13,
    subs:[
      {t:.6,  who:"Narrator", x:"The parcel service delivers Tadcu’s purchases unopened — which is more than it ever managed for anyone else."},
      {t:4.8, who:"Tadcu",   x:"A self-latching gate latch, Bryn. Opens AND closes “on its own” — like a bank."},
      {t:9.4, who:"Narrator", x:"The girls watched through the gate, from the field, like an audience."} ] },
  { id:"p-s2", name:"The Fitting", dur:14,
    subs:[
      {t:.8,  who:"Nerys",   x:"(postcard) Evidence of a purchase Tuesday. Fix on Wednesday. Brill."},
      {t:4.4, who:"Tadcu",   x:"Measure once, swear twice — latch lands level."},
      {t:8.4, who:"Narrator", x:"The latch gleamed like Tuesday."} ] },
  { id:"p-s3", name:"The Demonstration", dur:14,
    subs:[
      {t:.8,  who:"Tadcu",   x:"In theory, it latches itself in nine seconds."},
      {t:4.6, who:"Narrator", x:"In theory, Bryn is a dog."},
      {t:8.6, who:"Bryn",    x:"(nose. lift. pop. professional.)"},
      {t:11.8,who:"Narrator", x:"The latch cost twelve pounds. The dream was priceless."} ] },
  { id:"p-s4", name:"The Bench", dur:15,
    subs:[
      {t:1.2, who:"Narrator", x:"Some inventions are defeated by engineering. Some, by a good nose and forty minutes."},
      {t:5.4, who:"Tadcu",   x:"Nos da — and never change."},
      {t:9.2, who:"Narrator", x:"In Cwm Dwl the gate stays open, the kettle stays warm, and the series keeps its promise."} ] },
  { id:"p-end", name:"Season One", dur:6,
    subs:[ {t:2.2, who:"", x:"Nos da."} ] },
];
const TOTAL = SCENES.reduce((a,s)=>a+s.dur,0);
const STARTS = []; SCENES.reduce((a,s)=>{ STARTS.push(a); return a+s.dur; },0);

let idx=0, tOff=0, playing=false, lastTs=0;
const stage=document.getElementById('stage'),
      panels=[...document.querySelectorAll('.panel')],
      fill=document.getElementById('fill'),
      lbl=document.getElementById('lbl'),
      bPlay=document.getElementById('bPlay');

let actx=null;
function bloop(f0,f1,dur,type,gain){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(), n=actx.currentTime;
    o.type=type||"sine";
    o.frequency.setValueAtTime(f0,n);
    o.frequency.exponentialRampToValueAtTime(Math.max(40,f1),n+dur);
    g.gain.setValueAtTime(gain||.05,n);
    g.gain.exponentialRampToValueAtTime(.0001,n+dur);
    o.connect(g); g.connect(actx.destination); o.start(n); o.stop(n+dur+.02);
  }catch(e){}
}
const MUTE=false;

function startScene(i, silent){
  panels.forEach(p=>p.classList.remove('active'));
  const p=panels[i];
  void p.offsetWidth;
  p.classList.add('active');
  idx=i; tOff=0;
  lbl.textContent=`Scene ${i+1}/${SCENES.length} — ${SCENES[i].name}`;
  if(!MUTE){ bloop(220,330,.14,"triangle",.05); setTimeout(()=>bloop(330,440,.14,"triangle",.05),150); }
}

function esc(t){ const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

function setFill(){
  const start=idx===0?0:STARTS[idx];
  fill.style.width=(Math.min(100,(start+tOff)/TOTAL*100)).toFixed(2)+'%';
}

function tick(ts){
  if(playing){
    const dt=Math.min(.05,(ts-lastTs)/1000); lastTs=ts; tOff+=dt;
    if(tOff>=SCENES[idx].dur){
      if(idx<SCENES.length-1) startScene(idx+1,false);
      else { playing=false; bPlay.textContent='▶'; tOff=SCENES[idx].dur; setFill();
        lbl.textContent='Finished — press play to watch again'; return; }
    } setFill();
  }
  requestAnimationFrame(tick);
}

function play(){
  if(playing){ stage.classList.add('paused'); playing=false; bPlay.textContent='▶'; return; }
  stage.classList.remove('paused'); playing=true; bPlay.textContent='⏸';
  lastTs=performance.now();
  if(lbl.textContent.startsWith('Finished')) startScene(0,true);
  bloop(440,660,.12,"triangle",.04);
}
function restart(){ startScene(0,true); stage.classList.remove('paused'); playing=true; bPlay.textContent='⏸'; lastTs=performance.now(); }

bPlay.onclick=play;
document.getElementById('bRestart').onclick=restart;
document.getElementById('bSkip').onclick=()=>startScene((idx+1)%SCENES.length,false);
document.getElementById('bar').onclick=e=>{
  const r=e.currentTarget.getBoundingClientRect();
  const pos=(e.clientX-r.left)/r.width*TOTAL;
  let i=SCENES.length-1; for(let k=0;k<SCENES.length;k++){ if(STARTS[k]<=pos) i=k; }
  startScene(i,false);
};
window.addEventListener('keydown',e=>{
  if(e.code==='Space'){ e.preventDefault(); play(); }
  else if(e.key==='ArrowRight') startScene((idx+1)%SCENES.length,false);
  else if(/^[1-9]$/.test(e.key)) startScene(+e.key-1,false);
});

panels[0].classList.add('active');
requestAnimationFrame(tick);
</script>
</body>
</html>
